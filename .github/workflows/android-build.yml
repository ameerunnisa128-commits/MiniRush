name: MiniRush Android Automated Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build MiniRush APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Install Web & Capacitor Dependencies
        run: |
          echo "Installing dependencies..."
          npm install

      - name: 4. Build Vite/React Production Application
        run: |
          echo "Building production web assets..."
          npm run build

      - name: 5. Synchronize Web Assets with Android Project
        run: |
          echo "Running Capacitor sync for Android..."
          npx cap sync android

      - name: 6. Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: 7. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 8. Grant Execute Permission for Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 9. Build Debug Android APK (For Testing / Immediate Device Install)
        run: |
          echo "Compiling Debug APK..."
          cd android
          ./gradlew assembleDebug --stacktrace
          echo "Debug APK compilation completed successfully."

      - name: 10. Build Release Android App Bundle (AAB for Google Play)
        run: |
          echo "Compiling Release AAB..."
          cd android
          ./gradlew bundleRelease --stacktrace
          echo "Release AAB compilation completed successfully."

      - name: 11. Process Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          AAB_PATH="android/app/build/outputs/bundle/release/app-release.aab"
          
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "=========================================================================="
            echo "⚠️  NOTICE: RELEASE SIGNING NOT CONFIGURED"
            echo "=========================================================================="
            echo "The release AAB was built as an UNSIGNED package because one or more"
            echo "required GitHub Secrets are missing in your repository:"
            echo ""
            echo "  - KEYSTORE_BASE64   : $([ -n "$KEYSTORE_BASE64" ] && echo 'Configured ✓' || echo 'MISSING ✗')"
            echo "  - KEYSTORE_PASSWORD : $([ -n "$KEYSTORE_PASSWORD" ] && echo 'Configured ✓' || echo 'MISSING ✗')"
            echo "  - KEY_ALIAS         : $([ -n "$KEY_ALIAS" ] && echo 'Configured ✓' || echo 'MISSING ✗')"
            echo "  - KEY_PASSWORD      : $([ -n "$KEY_PASSWORD" ] && echo 'Configured ✓' || echo 'MISSING ✗')"
            echo ""
            echo "The unsigned AAB is still available as an artifact for inspection and testing."
            echo "To generate a signed, Google Play Store-ready AAB, configure these 4 secrets"
            echo "in: GitHub Repository -> Settings -> Secrets and variables -> Actions."
            echo "=========================================================================="
          else
            echo "=========================================================================="
            echo "🔐 All 4 signing secrets detected. Proceeding to sign Release AAB..."
            echo "=========================================================================="
            
            KEYSTORE_FILE="$(mktemp /tmp/release-keystore.XXXXXX.jks)"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            
            jarsigner -verbose \
              -sigalg SHA256withRSA \
              -digestalg SHA-256 \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$AAB_PATH" \
              "$KEY_ALIAS"
              
            echo "Verifying AAB digital signature..."
            jarsigner -verify -verbose -certs "$AAB_PATH"
            
            # Securely shred & remove the temporary keystore
            rm -f "$KEYSTORE_FILE"
            
            echo "✓ Release AAB has been successfully signed with your release key."
            echo "=========================================================================="
          fi

      - name: 12. Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniRush-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: 13. Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniRush-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
